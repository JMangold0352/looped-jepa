name: CPU tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run shape tests on CPU
        run: pytest tests/test_shapes.py -v
        env:
          CUDA_VISIBLE_DEVICES: ""
